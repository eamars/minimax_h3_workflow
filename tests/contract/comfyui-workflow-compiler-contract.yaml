name: comfyui-workflow-compiler-contract
skill: comfyui-workflow-compiler
checks:
  - {id: superseded_plan_revision, expect: PLAN_REVISION_INVALID, writes: false}
  - {id: validation_gate, expect: PLAN_NOT_READY, writes: false}
  - {id: capability_gate, expect: CAPABILITY_PROBE_MISSING, writes: false}
  - {id: unavailable_node, expect: WORKFLOW_NODE_UNAVAILABLE, queue_calls: 0}
  - {id: unavailable_model, expect: REQUIRED_MODEL_MISSING}
  - {id: stale_quality_input, expect: WORKFLOW_INPUT_UNSUPPORTED}
  - {id: embedded_or_unbound_placeholder, expect: WORKFLOW_MAPPING_INVALID}
  - {id: dangling_or_wrong_slot, expect: WORKFLOW_LINK_INVALID}
  - {id: graph_cycle, expect: WORKFLOW_CYCLE}
  - {id: over_cap, expect: SEGMENT_TOO_LONG}
  - {id: invalid_frame_grid, expect: INVALID_FRAME_GRID}
  - {id: unsupported_resolution, expect: RESOLUTION_UNSUPPORTED}
  - {id: missing_asset, expect: REQUIRED_ASSET_MISSING}
  - {id: validated_overwrite, expect: ARTIFACT_OVERWRITE_FORBIDDEN}
  - {id: independent_cut, expect: no_false_edge}
  - {id: continuation_before_tail, expect: HANDOFF_TAIL_INVALID}
  - {id: compile_only, expect: [workflows, jobs, dag, checksums], prompt_post_count: 0, render_count: 0}
  - {id: missing_pre_generation_controls, expect: PREGEN_CONTROLS_MISSING, writes: false}
  - {id: persistent_identity_on_t2va, expect: H3_MODE_MISMATCH, writes: false}
  - {id: dialogue_without_window, expect: DIALOGUE_WINDOW_MISSING, writes: false}
  - {id: on_screen_dialogue_before_visibility, expect: SPEAKER_VISIBILITY_UNBOUND, writes: false}
  - {id: unsigned_actor_path, expect: ACTOR_PATH_UNSIGNED, writes: false}
  - {id: unbounded_subject_instances, expect: SUBJECT_MULTIPLICITY_UNBOUNDED, writes: false}
  - {id: text_only_visual_reset, expect: TEXT_ONLY_VISUAL_RESET_UNSAFE, writes: false}
