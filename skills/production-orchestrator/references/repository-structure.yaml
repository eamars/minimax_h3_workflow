version: 1
purpose: Describe the project architecture that this skill routes; this file is a reference, not a requirement that an installed skill copy contain the project.

project_root: .
tracked_contracts:
  - architecture/
  - schemas/
  - orchestrator/production-orchestrator/
  - skills/
  - workflow-catalog/
  - tests/
runtime_only_paths:
  - ComfyUI/
  - workflows/
  - outputs/
  - logs/
  - seeding_material/
  - storyboards/
  - frames/
  - renders/
  - bridges/
  - edit/
  - prompts/
  - manifests/
  - audio/

planned_skill_packages:
  planning:
    - request-normalizer
    - reference-canon-manager
    - plot-architect
    - scene-performance-writer
    - sound-dialogue-planner
    - storyboard-director
    - animatic-previs-planner
    - production-preflight-reviewer
  compilation:
    - minimax-h3-adapter
    - keyframe-handoff-builder
    - comfyui-workflow-compiler
  execution:
    - render-orchestrator
  review:
    - continuity-qc-supervisor
  repair:
    - repair-director
  post:
    - post-editor

existing_package_alignment:
  skills/plot-architect:
    disposition: retain_and_normalize_in_milestone_2
    distribution: local_only_until_milestone_2_decision
  skills/storyboard:
    disposition: refactor_to_storyboard-director_in_milestone_2
    compatibility_alias: storyboard-director
  skills/comfyui:
    disposition: retain_as_generic_platform_guidance
    note: Production compilation authority belongs to comfyui-workflow-compiler.
  scripts/comfy_api_runner.py:
    disposition: retain_as_local_diagnostic_runner
    known_gap: Production compilation must add live schema, duration, provenance, and no-overwrite validation.

rules:
  - Treat user seed assets as canon; do not create a visual-development skill.
  - Keep generated video segments at or below 10 seconds after validated model-grid trimming.
  - Keep ComfyUI runtime, model weights, local workflows, renders, and logs outside tracked contracts.
  - Keep specialist ownership separate and the top orchestrator thin.
