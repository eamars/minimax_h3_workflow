version: 1

approval_record:
  required_fields:
    - plan_id
    - plan_version
    - plan_hash
    - status
    - approved_by
    - approved_at
    - approved_scope
    - conditions
  status_values:
    - pending
    - approved
    - rejected
    - revision_requested
  hash_format: '^sha256:[0-9a-f]{64}$'

compilation_gate:
  all_required:
    - production_plan.status == approved
    - production_plan.content_hash == approval.plan_hash
    - approval.status == approved
    - no_unresolved_blocking_preflight_issues
    - all_required_assets_exist_and_hash_match
    - all_required_decisions_resolved_or_explicitly_delegated
  failure_code: PLAN_APPROVAL_REQUIRED

change_control:
  required_fields:
    - affected_ids
    - reason
    - requested_owner
    - downstream_invalidation_scope
    - reapproval_required
  creative_reapproval_triggers:
    - story
    - performance
    - camera_intent
    - camera_setup_position
    - camera_viewpoint_or_optics
    - editorial_boundary_mechanism_or_motivation
    - generation_handoff_relationship_or_endpoint_policy
    - editorial_shot_boundary
    - reference_role
  technical_only_changes:
    rule: Version and revalidate without creative reapproval when a technical resplit or repack preserves the approved editorial shot boundaries, camera setup/motion and timing intent, continuity snapshots, generation relationships/policies, prompt intent, and all boundary IDs; any change to those fields is creative.
    permitted_examples:
      - split_or_merge_generation_segments_inside_one_approved_shot_for_model_frame_grid
      - recompute_source_time_and_record_handles_without_changing_picture_edit_points
      - rebind_a_workflow_template_without_changing_camera_or_generation_intent
    required_evidence:
      - superseding_revision_and_fresh_content_hash
      - old_to_new_segment_map
      - unchanged_camera_interval_map_hashes
      - unchanged_continuity_contract_hashes
      - unchanged_editorial_boundary_and_generation_handoff_hashes

invalidation_matrix:
  project_request:
    invalidates:
      - all_planning_artifacts
      - all_compilation_artifacts
      - all_render_and_post_artifacts
    reapproval_required: true
  asset_or_canon_mapping:
    invalidates:
      - visually_affected_plot_artifacts
      - affected_scene_artifacts
      - affected_storyboard_artifacts
      - affected_prompts_keyframes_workflows_and_renders
    reapproval_required: true
  plot_package:
    invalidates:
      - scene
      - sound
      - storyboard
      - animatic
      - preflight
      - production_plan
      - all_compilation
    reapproval_required: true
  scene_performance_package:
    invalidates:
      - affected_sound
      - storyboard
      - animatic
      - preflight
      - production_plan
      - all_compilation
    reapproval_required: true
  sound_plan:
    invalidates:
      - storyboard_audio_track
      - animatic
      - affected_h3_packets
      - affected_audio_and_post_workflows
    reapproval_required: true
  storyboard_package:
    invalidates:
      - animatic
      - preflight
      - production_plan
      - affected_h3_packets_keyframes_workflows_and_renders
    reapproval_required: true
  approved_production_plan:
    invalidates:
      - everything_compiled_or_rendered_from_superseded_plan
    reapproval_required: true
  h3_packet:
    invalidates:
      - its_comfyui_job
      - its_render_and_dependents
    reapproval_required: false
  workflow_template:
    invalidates:
      - jobs_compiled_from_template
      - their_unapproved_renders
    preserves:
      - creative_plan
    reapproval_required: false
  qc_criteria:
    invalidates:
      - affected_qc_verdicts
      - approvals_depending_on_those_verdicts
    reapproval_required: false

localized_repair:
  rules:
    - Preserve approved unaffected segments and intervals.
    - Invalidate a generation-handoff successor and its transitive dependents when its approved endpoint evidence or policy changes.
    - Do not invalidate an approved predecessor merely because a dependent middle segment fails.
    - Require plan reapproval if repair changes segment boundaries, camera intent, editorial boundary semantics, or generation relationship/policy.

overwrite_policy:
  approved_artifacts: forbidden
  approved_media: forbidden
  replacement: Create a new revision, retain the prior revision, and record supersedes.
  failure_code: APPROVED_ARTIFACT_OVERWRITE_FORBIDDEN
