version: 2
implementation_status: complete_approval_gated_pipeline
default_mode: PLAN_ONLY

execution_profiles:
  strict_serial_continuation:
    trigger: [state_continuity_required, no_parallelism_requested, continuation_chain]
    max_in_flight_jobs: 1
    allow_successor_precompile: false
    allow_successor_preadmission: false
    require_endpoint_hash: true
    endpoint_source: actual_final_decoded_frame
    endpoint_window_frames: 12
    successor_mode: MiniMaxH3ImageToVideo
    initial_mode: MiniMaxH3ReferenceToVideo
    gpu_policy: explicit_verified_rtx4090_for_model_clip_video_vae_audio_vae
    stop_before_render_without: [plan_delta_approval, frozen_continuation_capability, predecessor_qc_pass, endpoint_approval]

modes:
  PLAN_ONLY:
    stop_after: PLAN_REVIEW_READY
  REVISE_PLAN:
    requires: revision_request
    stop_after: PLAN_REVIEW_READY
  COMPILE_APPROVED_PLAN:
    requires:
      - valid_plan_approval
      - live_comfyui_probe_authorized
    stop_after: COMPILED
  PRODUCE_COMPILED_PLAN:
    requires: valid_compiled_bundle
    stop_after: ASSEMBLY_READY
  REPAIR_FAILED_OUTPUTS:
    requires: qc_failure_report
    stop_after: SEGMENT_QC
  ASSEMBLE_APPROVED_OUTPUTS:
    requires: approved_media_manifest
    stop_after: FINAL_QC
  FULL_PIPELINE_WITH_GATES:
    requires: explicit_stage_authorization
    stop_after: next_human_gate

planning_dispatch:
  - {type: skill, skill: request-normalizer}
  - {type: skill, skill: reference-canon-manager}
  - {type: skill, skill: plot-architect}
  - {type: skill, skill: scene-performance-writer}
  - {type: skill, skill: sound-dialogue-planner, trigger: conditional_dispatch.sound-dialogue-planner}
  - {type: skill, skill: storyboard-director}
  - {type: skill, skill: animatic-previs-planner}
  - {type: skill, skill: production-preflight-reviewer}
  - {type: integration, owner: production-orchestrator, authority: merge_only}
  - {type: gate, gate: human_review}

package_resolution:
  storyboard-director:
    current_package: skills/storyboard-director
    migration_milestone: complete
    rule: Route creative storyboard ownership only to the model-neutral storyboard-director package.
  comfyui-workflow-compiler:
    current_package: skills/comfyui-workflow-compiler
    migration_milestone: complete
    rule: Route production compilation only to the dedicated compiler; generic ComfyUI guidance is not compilation authority.
  registry: references/specialist-registry.yaml

compilation_dispatch:
  gate: valid_plan_approval
  order:
    - comfyui-live-capability-probe
    - freeze-capability-profile-and-workflow-catalog
    - minimax-h3-adapter
    - {skill: keyframe-handoff-builder, trigger: conditional_dispatch.keyframe-handoff-builder}
    - {skill: comfyui-workflow-compiler, requires: [approved-plan-hash, h3-packets, frozen-capability-profile, catalog-revision]}
    - validate-graphs-and-production-dag

execution_dispatch:
  - render-orchestrator
  - continuity-qc-supervisor
  - repair-director_on_failure
  - post-editor_when_all_required_media_approved
  - continuity-qc-supervisor_final_mode

execution_gates:
  render-orchestrator: [approved_plan_hash_match, validated_compiled_bundle]
  continuity-qc-supervisor: [completed_render_report, effective_media_hash]
  repair-director_on_failure: [current_qc_FAIL_with_evidence]
  post-editor_when_all_required_media_approved: [every_required_media_qc_PASS]
  continuity-qc-supervisor_final_mode: [assembled_master_hash, final_edl_hash, assembly_workflow_hash]
  delivered: [independent_final_qc_PASS, delivery_manifest_hash]

conditional_dispatch:
  sound-dialogue-planner:
    any:
      - dialogue_present
      - voice_reference_present
      - music_requested
      - cross_segment_audio_continuity_required
  keyframe-handoff-builder:
    any:
      - exact_endpoint_required
      - continuation_chain
      - fl2va_selected
      - bridge_required
      - prior_tail_must_be_reused

segment_policy:
  maximum_duration_seconds: 10
  preferred_duration_seconds:
    minimum: 4
    maximum: 8
  split_when:
    - duration_would_exceed_cap
    - camera_or_model_context_reset_required
    - action_complexity_high
    - reflection_hands_fluids_text_transformation_or_contact_risk
    - dialogue_sync_dense
    - stable_continuity_checkpoint_required
    - endpoint_or_reference_mode_changes
    - localized_repair_boundary_needed
  stable_exit_reject_if_when_endpoint_policy_requires_stable_tail:
    - motion_blur
    - face_occlusion
    - incomplete_expression_change
    - uncontrolled_water_or_smoke_occlusion
    - unplanned_fast_pan
    - impossible_or_ambiguous_reflection
  temporal_grid_policy:
    - Record target, model-aligned, and effective frame counts and durations separately.
    - Permit model-aligned duration above target only when required by a validated installed-model frame grid.
    - Trim decoded video and audio to an effective duration at or below 10 seconds before QC or handoff extraction.
    - Treat the effective post-trim clip as the authoritative segment artifact.

editorial_boundary_policy:
  allowed_mechanisms: [cut, dissolve, fade, end]
  bilateral_shot_references_required: true
  audio_behavior_required: true
  motivations_required: true
  dissolve:
    phase: post
    note: Do not use a dissolve to claim semantic or physical continuity.

generation_handoff_policy:
  allowed_relationships: [independent, same_shot_continue, endpoint_bridge, reference_reestablish, terminal]
  endpoint_policies: [none, moving_endpoint, stable_tail, approved_entry_reference, bridge_endpoints]
  same_shot_continue:
    dependency_order:
      - render_predecessor
      - qc_predecessor
      - evaluate_declared_endpoint_policy
      - approve_endpoint_when_required
      - bind_approved_endpoint_or_reference
      - compile_successor_job
      - render_successor
      - qc_successor
    parallelizable: false
  endpoint_bridge:
    requires:
      - approved_source_tail
      - approved_target_head
      - supported_first_last_frame_workflow
    parallelizable: false
  independent:
    parallelizable_when_inputs_stable: true
  reference_reestablish:
    parallelizable_when_reference_bindings_fixed: true
  terminal:
    requires: []

dag_policy:
  - Reject cycles before execution.
  - Add only dependencies required by source artifacts, approvals, or transition semantics.
  - Run independent cut branches concurrently within execution limits.
  - Block only the failed branch and its transitive dependents.
  - Preserve approved predecessors when a continuation successor fails.

comfyui_policy:
  - Require live /object_info and installed model files as capability authority; do not compile through stale positional fallbacks.
  - Compile from a versioned validated workflow catalog and explicit binding maps.
  - Record UI/API workflow revision, node versions, model versions, settings, seed, and deterministic paths.
  - Reject missing nodes or unsupported H3 mode combinations before queueing.
  - Normalize resolution, FPS, frame count, color, audio sample rate, and duplicate endpoints before assembly.
  - Preserve audio sample rate, channels, ambience state, and handoff audio beat across joins; reject unexplained clicks, restarts, or drift.
