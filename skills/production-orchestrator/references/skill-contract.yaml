name: production-orchestrator
version: 0.2.0
stage: orchestration
mode: planning
consumes:
  - lifecycle-request
  - versioned-specialist-artifacts
  - approval-record
  - capability-profile
  - qc-report
produces:
  - dispatch-result
  - project-state
  - production-plan-pair-v2
  - editorial-generation-topology
  - invalidation-scope
side_effects: filesystem
approval_required: false
may_modify_upstream_decisions: false
owner: production-orchestrator
implementation_status: invokable_milestone_3_real_cinematic
default_operating_mode: PLAN_ONLY
lifecycle_modes:
  PATH_TEST:
    requires_explicit_authorization: true
    visual_quality_evaluation: forbidden
    permitted_outputs: [technical_intake_manifest, non_deliverable_draft_master]
    forbidden_outputs: [qc_pass, final_qc_pass, delivery_manifest, DELIVERED]
    acceptance_script: skills/production-orchestrator/scripts/validate_path_test.py
  PRODUCTION:
    requires_explicit_authorization: true
    visual_quality_evaluation: required_before_delivery
    delivery_requires: [all_required_media_qc_pass, independent_final_qc_pass, delivery_manifest_hash]
technical_admission:
  environment_projection: [hard_profile_id, required_landmarks, boundary_language, negated_only_forbidden_features]
  continuity: [bilateral_limb_states, declared_interaction_targets, no_double_held_prop]
  resume: [original_admitted_job_set, plan_hash, dag_hash, capability_hash, environment_profile_hash]
