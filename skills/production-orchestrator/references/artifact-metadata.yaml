version: 1
metadata_key: artifact

required_fields:
  artifact_id:
    type: string
    description: Stable logical identity independent of filename.
  artifact_type:
    type: string
  project_id:
    type: string
  version:
    type: integer
    minimum: 1
  revision_id:
    type: string
    description: Immutable stable-ID and version pair.
  created_from:
    type: array
    description: Direct source artifact revision IDs; empty only for root intake.
  source_versions:
    type: array
    item_required_fields:
      - artifact_id
      - version
      - content_hash
  status:
    enum:
      - draft
      - review_ready
      - approved
      - rejected
      - superseded
  content_hash:
    type: string
    regex: '^sha256:[0-9a-f]{64}$'
  created_at:
    type: string
    format: RFC3339
  created_by:
    type: string
    description: Owning skill or deterministic tool identifier.
  provenance:
    type: object
    required_fields:
      - user_inputs
      - source_assets
      - upstream_artifacts

conditional_fields:
  compiled_or_later:
    applies_to_modes:
      - compilation
      - execution
      - review
      - repair
      - post
    required_fields:
      - approved_plan
    approved_plan_required_fields:
      - plan_id
      - plan_version
      - plan_hash
  generated_media:
    required_fields:
      - job_id
      - workflow_revision
      - prompt_packet_revision
      - seed
      - model_versions
      - node_versions
      - target_duration_seconds
      - model_frame_count
      - model_duration_seconds
      - effective_frame_count
      - effective_duration_seconds
      - fps
    duration_rules:
      - target_duration_seconds must be greater than 0 and at most 10.
      - effective_duration_seconds must be greater than 0 and at most 10.
      - Model duration may exceed the target only because of a validated temporal frame grid and must be explicitly trimmed before the clip is accepted.
      - Extract all approved head and tail frames from the effective post-trim clip.

hashing:
  algorithm: SHA-256
  prefix: 'sha256:'
  canonical_form: Canonical UTF-8 JSON with lexicographically sorted object keys and no insignificant whitespace.
  exclude_paths:
    - artifact.content_hash
    - artifact.status
    - artifact.superseded_by
    - approval.approved_at
    - approval.approved_by
    - approval.plan_hash
    - approval.status
    - approval.approved_scope
    - approval.conditions
  rule: Hash immutable authoritative content independently from lifecycle status and approval signatures; compare that exact content hash at compilation.

immutability:
  approved:
    mutable: false
    allowed_action: Create a new version that supersedes the approved revision.
  superseded:
    mutable: false
  draft:
    mutable: true
    note: Prefer explicit revisions once consumed downstream.

provenance_rules:
  - Preserve user seed asset hashes and declared roles through every downstream reference.
  - Record every direct upstream artifact by immutable revision ID and content hash.
  - Preserve prompt, workflow, model, node, seed, and media paths for every render attempt.
  - Reject an artifact whose declared source version cannot be resolved.
