name: keyframe-handoff-builder
version: 0.2.0
stage: keyframe
mode: compilation
consumes: [approved-production-plan, storyboard-package-v2, segment-plan, generation-handoff-manifest, asset-manifest, canon-lock, approved-render-and-qc-for-handoff, approved-target-endpoint-for-bridge, h3-prompt-packet-when-generating, capability-profile-when-generating]
produces: [keyframe-report, handoff-frame-selection]
side_effects: media_processing
approval_required: plan_approval
may_modify_upstream_decisions: false
owner: keyframe-handoff-builder
routing:
  upstream: [production-orchestrator-approval-gate, minimax-h3-adapter, storyboard-director, reference-canon-manager, continuity-qc-supervisor-when-continuing]
  downstream: [comfyui-workflow-compiler, render-orchestrator]
  conditional: true
triggers: [exact_endpoint_required, same_shot_continue, moving_endpoint, fl2va_selected, endpoint_bridge, prior_tail_must_be_reused]
endpoint_policies: [none, moving_endpoint, stable_tail, approved_entry_reference, bridge_endpoints]
endpoint_status_values: [pending, approved, rejected, superseded]
source_types: [user_seed, approved_tail, approved_target_still_job]
determinism: {hash: sha256, candidate_tie_break: latest_passing_frame, no_random_generation: true}
