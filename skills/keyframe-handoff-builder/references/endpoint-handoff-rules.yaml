version: 2
operation_gate: {pre_approval: read_only_metadata_only, required_plan_status: approved, required_plan_hash_match: true, dependent_jobs_require_endpoint_status: approved}
source_policy:
  user_seed: {endpoint_explicit: true, bind_original: true, regenerate_forbidden: true}
  approved_tail: {effective_post_trim_only: true, qc_pass_required: true, maximum_effective_seconds: 10}
  approved_target_still_job: {create_only_if_plan_requires: true}
selection: {tail_window: 'ceil(source_fps * 0.5)', candidate_order: descending_frame_index, choose: latest_passing, reject_if_any_unknown: true}
stability_rejection: [motion_blur, subject_or_face_occluded, off_model_identity, unstable_geometry, incomplete_expression, uncontrolled_water_or_smoke, unplanned_fast_pan, impossible_reflection, unresolved_hand_or_prop]
normalization:
  allowed_operations: [letterbox, pad, crop]
  forbidden: [stretch, inpaint, content_aware_fill, creative_edit]
relations:
  independent: {endpoint_dependency: none, parallelizable: true}
  same_shot_continue:
    endpoint_policies:
      stable_tail: {order: [qc_predecessor, approve_stable_tail, extract, normalize, approve_endpoint, bind_successor_first_frame], parallelizable: false}
      moving_endpoint: {order: [qc_predecessor, inspect_motion_endpoint, approve_motion_suitability, bind_successor_camera_path], parallelizable: false}
      approved_entry_reference: {order: [verify_reference_role, approve_entry_reference, bind_successor_first_frame], parallelizable: false}
  endpoint_bridge: {order: [approve_source, approve_target, verify_fl2va_capability, compile_bridge], parallelizable: false}
  reference_reestablish: {endpoint_dependency: approved_reference_binding, parallelizable: true}
  terminal: {endpoint_dependency: none}
approval:
  exact_user_seed: approved_by_plan_and_canon_hash
  derived_endpoint: pending_until_review
  approved_immutable: true
