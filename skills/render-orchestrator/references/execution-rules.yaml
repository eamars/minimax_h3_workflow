version: 1
admission:
  require: [approved_plan_hash_match, compiled_bundle_valid, dependencies_satisfied, output_path_confined]
  continue: [predecessor_complete, predecessor_qc_pass, approved_handoff_frame]
  bridge: [source_endpoint_approved, target_endpoint_approved]
scheduling:
  order: stable_topological
  concurrency: configured_positive_integer
  independent_cuts_parallel: true
idempotency:
  prompt_ids: deterministic_uuid5_per_attempt
  stable_client_id_per_run: true
  reconcile_before_resubmit: true
retry:
  transient_only: true
  http_statuses: [408, 409, 425, 429, 500, 502, 503, 504]
  backoff_seconds: [2, 5, 15]
  random_jitter: false
  creative_or_validation_retry: false
outputs:
  verify: [exists, decodes, path_confined, sha256]
  success_route: continuity-qc-supervisor
