name: continuity-qc-supervisor
version: 0.1.0
stage: review
mode: review
consumes: [approved-production-plan, approval-record, render-report, qc-intake-manifest, effective-rendered-media, diagnostic-frame-manifest, canon-lock, asset-manifest, h3-prompt-packet, comfyui-job, workflow-record, predecessor-approved-endpoint-optional, successor-approved-entry-optional, approved-media-manifest-optional, edit-decision-list-optional]
produces: [qc-report, qc-evidence-bundle, approved-media-manifest, handoff-verdict]
side_effects: filesystem
approval_required: plan_approval
may_modify_upstream_decisions: false
owner: continuity-qc-supervisor
schema: schemas/qc-report.schema.json
modes: [segment, handoff, final]
routing:
  upstream: [render-orchestrator, production-orchestrator, keyframe-handoff-builder-when-handoff, post-editor-when-final]
  downstream: [repair-director-on-failure, keyframe-handoff-builder-on-approved-tail, post-editor-after-approved-media, production-orchestrator]
  parallelizable: independent_segments_only
verdicts: [PASS, PASS_WITH_EDITORIAL_FIX, FAIL]
severities: [none, minor, major, critical]
continuation_requires: [verdict_PASS, effective_clip_valid, stable_exit_state, approved_predecessor_when_continuing, no_major_or_critical_failures]
independence: {qc_never_authors_repair: true, repaired_output_requires_new_revision: true, repaired_output_requires_new_qc_pass: true}
failure_codes: [QC_INPUT_INVALID, QC_PLAN_HASH_MISMATCH, QC_MEDIA_DECODE_FAILURE, QC_MEDIA_SPEC_FAILURE, QC_CRITERIA_UNTRACEABLE, QC_EVIDENCE_MISSING, QC_TAIL_APPROVAL_BLOCKED, QC_MANIFEST_CONFLICT, IDENTITY_DRIFT, ENVIRONMENT_DRIFT, ACTION_ORDER_FAILURE, CAMERA_FAILURE, REFLECTION_FAILURE, AUDIO_SYNC_FAILURE, HANDOFF_MISMATCH, FINAL_EDIT_CONTINUITY_FAILURE]
