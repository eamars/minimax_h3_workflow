version: 1
approved_overwrite: {allowed: false, failure_code: APPROVED_ARTIFACT_OVERWRITE_FORBIDDEN}
base_scope:
  always_invalidate: [failed_render_revision, failed_qc_revision, changed_prompt_or_job, downstream_consumers]
  always_preserve: [approved_unaffected_segments, approved_assets_and_canon, approved_predecessor_media_unless_changed]
by_strategy:
  prompt_only: {invalidate: [segment_job, segment_render, segment_qc, dependent_post_joins], reapproval: false}
  mode_change: {invalidate: [segment_prompt, segment_job, segment_render, segment_qc, dependents], reapproval: false_if_technical_only}
  clean_endpoint: {invalidate: [failed_endpoint, successor_entry_and_transitive_dependents], preserve: [approved_predecessor_media]}
  shorten_split: {invalidate: [all_artifacts_from_superseded_plan], reapproval: true}
  audio_only: {invalidate: [audio_track_or_mix, audio_qc, affected_post_joins], preserve: [approved_picture]}
  picture_only: {invalidate: [picture_segment, picture_qc, affected_post_joins], preserve: [approved_audio]}
continuation_rule:
  when: repaired_entry_or_tail_changes
  invalidate: [successor_entry, successor_job, successor_render, successor_qc, transitive_dependents]
  preserve: [approved_predecessor_media]
post_rule: {no_manifest_inclusion_before_new_qc_pass: true}
