version: 1
typed_bindings:
  scalar: {allowed_types: [string, integer, number, boolean, enum, path], exact_placeholder_only: true, embedded_forbidden: true}
  path: {must_exist: true, must_be_approved_or_generated: true, traversal_forbidden: true}
  link: {live_slot_type_check: true}
  enum: {live_object_info_authoritative: true}
  duration: {exclusive_minimum: 0, maximum: 10}
template_selection:
  require_exact_job_type_and_mode: true
  supported_transition_types: [cut, continue, bridge, match_cut, dissolve, end]
  dissolve: {template_forbidden: true, post_only: true}
  r2va: {dynamic_autogrow_inputs_from_live_object_info: true, max_images: 9, max_videos: 3, max_audio: 3, ordinal_order: [images, videos_and_paired_audio, standalone_audio]}
  no_implicit_template_substitution: true
mapping_invariants:
  all_placeholders_declared: true
  all_declared_bindings_consumed_or_explicitly_optional: true
  live_input_names_exact: true
  template_nodes_subset_of_live_classes: true
  required_model_categories_resolve_to_installed_filenames: true
  no_plan_segment_boundary_mutation: true
