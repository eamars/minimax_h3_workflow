rules:
  - Return one or more codes with affected stable IDs and evidence.
  - Distinguish transient infrastructure errors from creative or contract failures.
  - Do not retry creative failures by random parameter mutation.
  - Route failure correction to the owning upstream package or Repair Director; QC never authors its own repair.
