version: 1
encoding: UTF-8
path_separator: /

skill_names:
  regex: '^[a-z0-9]+(?:-[a-z0-9]+)*$'
  maximum_length: 63
  rule: Use lowercase verb- or responsibility-led hyphenated names; folder name must equal skill name.

stable_ids:
  project:
    example: PRJ01
    regex: '^PRJ[0-9]{2,}$'
  sequence:
    example: SEQ01
    regex: '^SEQ[0-9]{2,}$'
  scene:
    example: SEQ01_SC01
    regex: '^SEQ[0-9]{2,}_SC[0-9]{2,}$'
  plot_beat:
    example: SEQ01_SC01_B03
    regex: '^SEQ[0-9]{2,}_SC[0-9]{2,}_B[0-9]{2,}$'
  shot:
    example: SEQ01_SC01_SH02
    regex: '^SEQ[0-9]{2,}_SC[0-9]{2,}_SH[0-9]{2,}$'
  generation_segment:
    example: SEQ01_SC01_SH02_SEG01
    regex: '^SEQ[0-9]{2,}_SC[0-9]{2,}_SH[0-9]{2,}_SEG[0-9]{2,}$'
  job:
    example: JOB_SEQ01_SC01_SH02_SEG01_R01
    regex: '^JOB_SEQ[0-9]{2,}_SC[0-9]{2,}_SH[0-9]{2,}_SEG[0-9]{2,}_R[0-9]{2,}$'
  bridge_job:
    example: JOB_SEQ01_SC01_SH02_SEG01__SEQ01_SC01_SH02_SEG02_BRIDGE_R01
    regex: '^JOB_SEQ[0-9]{2,}_SC[0-9]{2,}_SH[0-9]{2,}_SEG[0-9]{2,}__SEQ[0-9]{2,}_SC[0-9]{2,}_SH[0-9]{2,}_SEG[0-9]{2,}_BRIDGE_R[0-9]{2,}$'
  segment_utility_job:
    example: JOB_SEQ01_SC01_SH02_SEG01_FRAME_EXTRACT_R01
    regex: '^JOB_SEQ[0-9]{2,}_SC[0-9]{2,}_SH[0-9]{2,}_SEG[0-9]{2,}_(?:KEYFRAME_IN|KEYFRAME_OUT|FRAME_EXTRACT)_R[0-9]{2,}$'
  project_post_job:
    example: JOB_PRJ01_FINAL_EXPORT_R01
    regex: '^JOB_PRJ[0-9]{2,}_(?:CONCAT|AUDIO_MIX|FINAL_EXPORT)_R[0-9]{2,}$'

id_rules:
  - Keep an ID stable when wording or non-structural metadata changes.
  - Allocate a new ID when a structural unit is added, split, merged, or changes parent.
  - Represent attempts and artifact revisions with revision fields or suffixes; never mutate the stable segment ID.
  - Do not use a filename as an artifact identity.

revisions:
  artifact_version:
    example: 1
    rule: Use a positive integer in metadata and render as vNN in human-facing filenames.
  render_revision:
    example: R01
    regex: '^R[0-9]{2,}$'
  filename_render_revision:
    example: r01
    regex: '^r[0-9]{2,}$'
    rule: Map metadata/job revision RNN to lowercase rNN only in filenames.
  immutable_revision_id:
    example: SEQ01_SC01_SH02_SEG01@v01
    pattern: '<stable-id>@v<two-or-more-digits>'

deterministic_paths:
  production_plan_markdown: plan/production-plan-vNN.md
  production_plan_yaml: plan/production-plan-vNN.yaml
  h3_prompt_text: compiled/prompt-packets/<segment-id>.txt
  h3_prompt_packet_manifest: compiled/prompt-packets/h3-prompt-packets.yaml
  comfyui_workflow: compiled/workflows/<job-id>.json
  comfyui_job: compiled/jobs/<job-id>.yaml
  segment_input_frame: keyframes/<segment-id>_in.png
  segment_output_frame: keyframes/<segment-id>_out.png
  tail_candidate: frames/<segment-id>_tail_<candidate>.png
  draft_render: renders/draft/<segment-id>_rNN.mp4
  validated_render: renders/validated/<segment-id>_rNN.mp4
  bridge_render: bridges/<from-segment-id>__<to-segment-id>_bridge_rNN.mp4
  qc_report: qc/<segment-id>_rNN.yaml
  final_render: renders/final/<project-id>_master_rNN.mp4

path_rules:
  - Store repository artifact paths as relative POSIX-style paths.
  - Include stable ID and revision in generated filenames.
  - Reject path traversal, absolute production paths, and ambiguous latest aliases in authoritative manifests.
  - Write new revisions beside prior revisions; never overwrite validated media.
