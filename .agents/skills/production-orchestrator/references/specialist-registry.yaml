version: 2
resolution: sibling_installed_skill
rule: Load each named SKILL.md before dispatch; never substitute a generic or legacy package for an unavailable specialist.
shared_contract_resolution:
  repository: ../../../../schemas
  installed: references/shared/schemas
  workflow_catalog_repository: ../../../../workflow-catalog
  workflow_catalog_installed: references/shared/workflow-catalog
  rule: Prefer the repository paths when present; otherwise use the installed self-contained copies.
specialists:
  request-normalizer: {path: ../../request-normalizer/SKILL.md, stage: intake, produces: [project-request, assumptions, open-decisions]}
  reference-canon-manager: {path: ../../reference-canon-manager/SKILL.md, stage: canon, produces: [asset-manifest, canon-lock, reference-conflict-report, reference-order]}
  plot-architect: {path: ../../plot-architect/SKILL.md, stage: plot, produces: [plot-package]}
  scene-performance-writer: {path: ../../scene-performance-writer/SKILL.md, stage: scene, produces: [scene-performance, scene-text, performance-continuity]}
  sound-dialogue-planner: {path: ../../sound-dialogue-planner/SKILL.md, stage: sound, conditional: true, produces: [sound-plan, dialogue-cue-sheet, voice-continuity]}
  storyboard-director: {path: ../../storyboard-director/SKILL.md, stage: storyboard, produces: [storyboard-package-v2, shot-table, segment-plan, editorial-boundary-manifest, generation-handoff-manifest, creative-acceptance-tests]}
  animatic-previs-planner: {path: ../../animatic-previs-planner/SKILL.md, stage: previs, produces: [animatic-plan-v2, paper-edit, shot-segment-assembly, sound-boundary-map, pacing-review]}
  production-preflight-reviewer: {path: ../../production-preflight-reviewer/SKILL.md, stage: preflight, produces: [preflight-report, risk-register, revision-requests]}
  minimax-h3-adapter: {path: ../../minimax-h3-adapter/SKILL.md, stage: compilation, validation_required: true, produces: [h3-prompt-packets, h3-validation-report]}
  keyframe-handoff-builder: {path: ../../keyframe-handoff-builder/SKILL.md, stage: keyframe, conditional: true, validation_required: true, produces: [keyframe-report, handoff-frame-selection]}
  comfyui-workflow-compiler: {path: ../../comfyui-workflow-compiler/SKILL.md, stage: compilation, validation_required: true, produces: [workflows, jobs, production-dag, compile-report]}
  render-orchestrator: {path: ../../render-orchestrator/SKILL.md, stage: execution, validation_required: true, produces: [run-state, job-reports, execution-log]}
  continuity-qc-supervisor: {path: ../../continuity-qc-supervisor/SKILL.md, stage: review, produces: [qc-reports, validated-media-manifest]}
  repair-director: {path: ../../repair-director/SKILL.md, stage: repair, conditional: true, produces: [repair-plan, revised-job-spec, invalidation-scope]}
  post-editor: {path: ../../post-editor/SKILL.md, stage: post, produces: [final-edl, assembly-plan, audio-mix-plan, final-workflow, delivery-manifest]}
