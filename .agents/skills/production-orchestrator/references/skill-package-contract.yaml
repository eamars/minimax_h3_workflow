version: 1

skill_md_frontmatter:
  required_keys:
    - name
    - description
  allowed_keys:
    - name
    - description
  rationale: Codex skill discovery reads only name and description; operational metadata belongs in skill-contract.yaml.

sidecar:
  filename: skill-contract.yaml
  required_fields:
    - name
    - version
    - stage
    - mode
    - consumes
    - produces
    - side_effects
    - validation_required
    - may_modify_upstream_decisions
    - owner
  enums:
    stage:
      - intake
      - canon
      - plot
      - scene
      - sound
      - storyboard
      - previs
      - preflight
      - orchestration
      - compilation
      - keyframe
      - execution
      - review
      - repair
      - post
    mode:
      - planning
      - compilation
      - execution
      - review
      - repair
      - post
    side_effects:
      - none
      - filesystem
      - comfyui_api
      - media_processing
  invariants:
    validation_required_values:
      - false
      - plan_validation
      - endpoint_validation
      - output_validation
    may_modify_upstream_decisions: false

skill_md_required_sections:
  - Mission
  - Ownership boundary
  - Inputs
  - Required outputs
  - Processing method
  - Invariants
  - Non-responsibilities
  - Failure conditions
  - Validation rules
  - Minimal example
  - Adversarial example
  - Acceptance tests

package_rules:
  - Keep SKILL.md under 500 lines and move detailed contracts to directly linked sidecars or references.
  - Use imperative instructions in SKILL.md.
  - Return machine-readable status and failure codes.
  - Consume and produce schema-valid artifacts without manual reinterpretation.
  - Preserve source provenance and revision history.
  - Do not duplicate another package's decision authority.
