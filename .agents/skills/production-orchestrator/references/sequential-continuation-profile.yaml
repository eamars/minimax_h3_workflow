version: 3
profile_id: h3_multishot_continuity
source: https://huggingface.co/joeygambino/MiniMax-H3-Multishot-Workflow
purpose: Preserve character, environment, camera, motion, and audio continuity across independently generated H3 shots.
timebase:
  fps: 24
  preferred_segment_seconds: {minimum: 8, maximum: 10}
  maximum_segment_seconds: 10
continuity:
  serial_relationship: same_shot_continue
  temporal_state_input: predecessor_actual_final_decoded_frame
  substitute_earlier_endpoint: forbidden
  first_frame_must_equal_bound_endpoint: true
  opening_airlock_seconds: 2
  opening_airlock_motion: preserve_bound_endpoint_motion_vector_or_micro_motion_for_stable_tail
  settled_landing_seconds: 2
  repeat_declared_character_locks_verbatim: true
  repeat_declared_environment_and_lighting_locks_verbatim: true
  named_style_lock: repeat_only_when_declared
  unspecified_style: remain_open
  split_spoken_line_across_generation_segments: discouraged_unless_explicit_and_qc_validated
  cross_editorial_shot_dialogue: allowed_with_explicit_j_cut_or_l_cut_and_speaker_transition
  camera_cuts_inside_shot: allowed
  scene_or_shot_transition_at_generation_boundary: forbidden
  transition_placement_ratio: {minimum: 0.4, maximum: 0.6}
  transition_segment_must_establish_destination_before_landing: true
  successor_starts_in_established_destination_context: true
  continuity_transfer_between_shots: required
  continuation_state_vector: [action_phase, pose, gaze, left_right_limb_state, prop_ownership_and_contact, camera_pose, camera_motion_vector, focus_plane, lighting_state, active_speaker_and_dialogue_span, ambience_state, next_allowed_delta]
  completed_action_replay_in_successor: forbidden
  long_chain_policy: restart_from_reference_at_scene_cut
endpoint_validation:
  tail_window_frames: 12
  inspect: [identity, environment, props, limb_state, camera, motion_vector, lighting, audio_state]
  policies: [stable_tail, moving_endpoint, declared_entry_reference, bridge_endpoints]
  failed_endpoint: block_dependent_successor
execution_order:
  - render_predecessor
  - decode_output
  - inspect_full_segment
  - extract_actual_final_frame
  - validate_endpoint
  - bind_successor_first_frame
  - compile_successor
  - render_successor
assembly:
  preserve_declared_record_order: true
  remove_boundary_frame_only_when_pixel_identical: true
  retime_or_interpolate_without_plan: forbidden
  final_master_qc_required: true
