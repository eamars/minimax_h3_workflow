name: storyboard-director
version: 0.4.0
stage: storyboard
mode: planning
consumes: [project-request, canon-lock, asset-manifest, environment-profile, plot-package, scene-performance, optional-sound-plan, optional-storyboard-revision-request]
produces: [storyboard-package-v2, shot-table, segment-plan, editorial-boundary-manifest, generation-handoff-manifest, creative-acceptance-tests]
side_effects: none
validation_required: false
may_modify_upstream_decisions: false
owner: storyboard-director
implementation_status: invokable_milestone_3_real_cinematic
routing:
  upstream: [request-normalizer, reference-canon-manager, plot-architect, scene-performance-writer, sound-dialogue-planner_when_triggered]
  downstream: [animatic-previs-planner, production-preflight-reviewer]
  parallelizable: false
segment_policy:
  duration_seconds: {exclusive_minimum: 0, maximum: 10}
  preferred_seconds: {minimum: 4, maximum: 8}
  one_primary_performance_arc: true
  one_dominant_in_shot_camera_move: true
  camera_position_change_between_shots: allowed_when_motivated
  stable_exit_scope: typed_generation_handoff_only
  time_domains: [scene_time, source_time, record_time]
transition_policy:
  editorial_mechanisms: [cut, dissolve, fade, end]
  generation_relationships: [independent, same_shot_continue, endpoint_bridge, reference_reestablish, terminal]
  mechanism_and_relationship_are_separate: true
failure_codes: [STORYBOARD_INPUT_SCHEMA_INVALID, STORYBOARD_SOURCE_VERSION_MISMATCH, ENVIRONMENT_LOCK_MISSING, ENVIRONMENT_FEATURE_FORBIDDEN, SHOT_HAS_NO_PURPOSE, COVERAGE_THIN, BLOCKING_AMBIGUOUS, SCENE_GEOGRAPHY_MISSING, UNKNOWN_GEOMETRY_UNHANDLED, CAMERA_MODEL_OPAQUE, CAMERA_SETUP_MISSING, CAMERA_POSITION_UNMOTIVATED, CAMERA_MOVE_UNMOTIVATED, SEGMENT_TOO_LONG, SEGMENT_NONPOSITIVE, SEGMENT_OVERLOADED, TIME_DOMAIN_MISSING, TIMELINE_NONMONOTONIC, ENTRY_STATE_MISSING, CONTINUITY_CONTRACT_MISSING, LIMB_CONTINUITY_MISSING, CONTINUITY_SNAPSHOT_PAYLOAD_MISMATCH, EXIT_STATE_UNSTABLE, HANDOFF_UNSPECIFIED, EDITORIAL_GENERATION_BOUNDARY_CONFLATED, EDITORIAL_BOUNDARY_BILATERAL_MISMATCH, TRANSITION_SEMANTICS_INVALID, GENERATION_RELATIONSHIP_INVALID, MOVING_HANDOFF_POLICY_MISSING, STORYBOARD_TRACEABILITY_MISSING, STORYBOARD_TECHNOLOGY_CONTAMINATION, STORYBOARD_ARTIFACT_PROVENANCE_INVALID]
environment_lock:
  required: true
  enforcement: hard_reference_no_expansion
  camera_position_change_does_not_change_environment: true
continuity:
  authoritative_registry: exactly_one
  interactive_actions_require_limb_states: true
  embedded_interactive_payload_must_match_registry: true
  interaction_target_registry: required_when_holding_or_contact_target_is_used
  target_types: [prop, body_zone, landmark, surface]
  holding_requires_prop_target: true
  contact_target_must_be_declared: true
  double_held_prop: forbidden
  unexplained_same_limb_prop_swap: forbidden
