version: 3
planning_model_version: 2
time_domains:
  scene_time: narrative_action_clock
  source_time: generated_clip_local_clock
  record_time: final_editorial_timeline
editorial_shot:
  shot_id_persists_across_segments: true
  camera_position_change_between_shots: allowed_when_motivated
  required_camera_fields: [setup.position, setup.orientation, setup.optics, setup.composition, setup.axis, in_shot_motion]
  required_staging_fields: [geography_id, subject_positions, action_path, eyelines, entry_exit]
segment:
  duration_seconds: {exclusive_minimum: 0, maximum: 10}
  preferred_seconds: {minimum: 4, maximum: 8}
  primary_performance_arc: exactly_one
  dominant_in_shot_camera_motion: exactly_one_or_static
  stable_exit_required_for: [same_shot_continue, endpoint_bridge]
  active_motion_exit_allowed_for: [independent, reference_reestablish]
  stable_exit_forbid: [motion_blur, face_or_prop_occlusion, incomplete_expression_change, uncontrolled_water_or_smoke, unplanned_fast_pan, impossible_reflection]
  timeline: {tracks: [performance, camera, sound, edit_handoff], intervals: positive_monotonic_within_duration}
shot_projection:
  required_for_each_editorial_shot: [shot_size, visible_content, camera, action, dialogue_or_speaker_state, sound]
  dialogue_timing: fit_words_to_shot_duration
  cross_picture_cut_speech: {allowed: true, requires: [speaker_id, on_screen_or_off_screen_state, j_cut_or_l_cut_span]}
  one_take: {internal_editorial_cuts: forbidden, downstream_shot_block_count: 1}
  exact_first_last_frame: {default_behavior: continuous_interpolation, automatic_cut: forbidden}
style:
  source_precedence: [user_explicit, canon_lock, declared_style_reference, upstream_treatment]
  unspecified_named_style: remain_open
  adapter_default_style: forbidden
editorial_boundaries:
  mechanisms: [cut, dissolve, fade, end]
  required_fields: [from_shot_id, to_shot_id, mechanism, motivations, audio_behavior, record_time]
  bilateral_shot_references: true
generation_handoffs:
  relationships: [independent, same_shot_continue, endpoint_bridge, reference_reestablish, terminal]
  endpoint_policies: [none, moving_endpoint, stable_tail, declared_entry_reference, bridge_endpoints]
  editorial_mechanism_forbidden: true
continuity:
  required: [invariants, expected_deltas, forbidden_deltas, limb_states, prop_states]
  identity_environment_state_must_survive_framing_changes: true
  authoritative_registry: exactly_one
  embedded_snapshot_policy: id_reference_or_exact_interactive_payload
  interactive_actions_require: [before_contact, contact_or_transfer, after_contact]
  split_interaction_handoff: [action_phase, pose, gaze, left_right_limb_state, prop_ownership_and_contact, camera_pose, camera_motion_vector, focus_plane, lighting_state, active_speaker_and_dialogue_span, ambience_state, next_allowed_delta]
  completed_action_replay_in_successor: forbidden
environment_lock:
  required_fields: [environment_profile_id, source_asset_id, enforcement, required_landmarks, forbidden_inventions, unknown_regions, negative_space_rule]
  enforcement: hard_reference_no_expansion
  camera_position_change_does_not_expand_environment: true
  forbidden_architecture_must_be_preserved: true
creative_acceptance:
  every_shot: [plot_trace, purpose, coverage_function, geography, staging, typed_camera, continuity_in, continuity_out, editorial_boundary_links]
  every_segment: [duration, scene_time, source_time, record_time, entry_state, performance_arc, camera_interval_map, four_tracks, exit_state, generation_handoff, traceability, predicates]
