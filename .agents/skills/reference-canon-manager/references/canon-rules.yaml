version: 3
hashing:
  source_assets: {algorithm: SHA-256, input: raw_file_bytes, output_format: '^sha256:[0-9a-f]{64}$'}
roles:
  subject_identity: {controls: [identity, proportions, facial_structure, hair, stable_design]}
  environment_architecture: {controls: [architecture, spatial_layout, fixtures, persistent_materials, observable_landmarks, geography_evidence, allowed_features, forbidden_inventions, unknown_features, negative_space]}
  style_rendering: {controls: [rendering, palette, lighting_language, texture_language]}
  wardrobe: {controls: [garment_design, material, color, accessories]}
  prop: {controls: [object_shape, object_material, object_markings]}
  pose_expression: {controls: [declared_pose, declared_expression], binding: performance_only}
  camera_composition: {controls: [framing, viewpoint, composition, lens_appearance], binding: appearance_evidence_only, does_not_freeze_position: true}
  motion_reference: {controls: [movement_quality, temporal_pattern]}
  storyboard_reference: {controls: [declared_shot_order, declared_coverage_examples, declared_transition_examples], binding: route_to_storyboard_without_interpretation}
  edit_rhythm_reference: {controls: [declared_cut_rhythm, declared_transition_grammar, declared_pacing_pattern], binding: route_to_storyboard_and_animatic_without_copying_content}
  audio_reference: {controls: [voice_character, ambience, music_texture]}
wardrobe_surface_state:
  contract: .agents/skills/reference-canon-manager/references/wardrobe-surface-state.md
  required_for: [recurring_character, recurring_prop]
  required_fields: [contract_id, canon_revision, wardrobe_lock, surface_state_lock, transition_policy, occlusion_policy, forbidden_implicit_changes]
  wardrobe_component_fields: [component_id, region, observable_description, material_or_texture, color_or_markings, visibility_policy]
  surface_region_fields: [region_id, state, extent_or_intensity, confidence, source_evidence]
  default_carry_policy: inherit
  implicit_change_policy: forbidden
  occlusion_policy: occluded_preserve
  transitions_must_be: [typed, scoped, reasoned, carried_to_next_snapshot]
  generic_labels_forbidden: [uniform, outfit, costume]
  state_labels_requiring_region_and_extent: [dirty, wet, muddy, dusty, stained, damaged]
endpoint_rules:
  default: none
  never_infer_from: [filename, file_order, visual_composition, apparent_start_state, apparent_end_state]
canon_extraction:
  missing_attribute: unspecified
  visual_redesign: forbidden
  inferred_story_meaning: forbidden
  incidental_person: must_not_transfer_unless_explicit_subject
  environment_profile:
    enforcement: hard_reference_no_expansion
    required_fields: [profile_id, source_asset_id, required_landmarks, allowed_features, forbidden_inventions, unknown_features, negative_space_rule]
    positive_lock: required_landmarks_and_allowed_features
    negative_lock: forbidden_inventions
    unknown_handling: preserve_unknown_and_do_not_complete
    partial_landmark_rule: do_not_promote_partial_edges_to_full_fixtures
    camera_position: storyboard_owned
  geography:
    confidence_values: [exact, inferred, unknown]
    unknown_handling: preserve_unknown_and_route_to_storyboard
    coordinates: never_invent
  time_scope:
    values: [project, sequence, scene, shot, endpoint]
    missing_scope: unspecified
conflict_policy:
  precedence: [explicit_user_role_and_scope, explicit_user_priority, project_request_scope, deterministic_tie_break]
  forbidden_resolution_basis: [filename, filesystem_order, recency, model_confidence, aesthetic_preference]
reference_order:
  sort: [priority_ascending, scope_specificity_descending, endpoint_explicit_descending, role_rank_ascending, sha256_ascending, asset_id_ascending]
immutability:
  source_actions_forbidden: [mutate, copy, crop, resize, reencode, metadata_strip]
  derived_media_owner: keyframe-handoff-builder
