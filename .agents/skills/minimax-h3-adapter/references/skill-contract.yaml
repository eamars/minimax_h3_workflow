version: 3
name: minimax-h3-adapter
stage: compilation
mode: compilation
consumes: [production-plan-v2, generation-segment-v2, canon-lock, asset-manifest, reference-order, sound-plan-optional, frozen-h3-capability-profile]
produces: [h3-prompt-text, h3-prompt-packet-manifest, h3-validation-report]
side_effects: filesystem
validation_required: plan_validation
may_modify_upstream_decisions: false
owner: minimax-h3-adapter
implementation_status: invokable_milestone_4_contract
requires:
  plan_input: {artifact_id: required, revision_id: required, unusable_statuses: [failed, superseded]}
  capability_profile: {live_object_info_evidence: true, installed_model_evidence: true, revision_id: required}
limits: {effective_duration_seconds: {exclusive_minimum: 0, maximum: 10}, fps: 24, frame_grid: '17k+5', width_height_multiple: 32, time_domains: [scene_time, source_time, record_time]}
camera_binding: {typed_setup_and_motion_required: true, position_changes_preserved: true}
environment_binding: {hard_profile_id_required: true, required_landmarks_required: true, boundary_language_required: true, forbidden_features: negated_validation_only, validator: scripts/validate_environment_projection.py}
pre_generation_controls:
  required_status: PRE_GENERATION_VALIDATED
  fields: [identity, subject_instances, dialogue_cues, motion, visual_reset]
  text_only_substitution: forbidden
routing:
  predecessor: [comfyui-live-capability-probe, freeze-capability-profile-and-workflow-catalog]
  successor: [keyframe-handoff-builder-when-triggered, comfyui-workflow-compiler]
failure_codes: [PLAN_REVISION_INVALID, SEGMENT_TOO_LONG, H3_MODE_MISMATCH, H3_REFERENCE_LABEL_MISMATCH, H3_REFERENCE_USAGE_MISSING, CANON_IDENTITY_BINDING_MISSING, REQUIRED_ASSET_MISSING, H3_PROMPT_TOO_LONG, H3_UNDECLARED_CUT, H3_ONE_TAKE_CUT_CONFLICT, DIALOGUE_WINDOW_MISSING, DIALOGUE_TIMING_MISMATCH, DIALOGUE_SPEAKER_UNCLEAR, SPEAKER_VISIBILITY_UNBOUND, ACTOR_PATH_UNSIGNED, SUBJECT_MULTIPLICITY_UNBOUNDED, TEXT_ONLY_VISUAL_RESET_UNSAFE, ENTRY_STATE_MISSING, EXIT_STATE_UNSTABLE, CONTINUATION_DELTA_INVALID]
