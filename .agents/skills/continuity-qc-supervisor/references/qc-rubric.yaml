version: 2
evidence:
  decoder: pyav
  preferred_runtime: ComfyUI/.venv
  sample_policy: [first_frame, last_frame, every_timeline_boundary_plus_or_minus_one_frame, quartiles, final_12_frames]
  hash: sha256
technical:
  effective_duration_seconds: {exclusive_minimum: 0, maximum: 10}
  fps: exact_plan_value
  dimensions: exact_plan_value
  frame_timestamps: strictly_ordered
  decode: every_frame
criteria:
  - {id: action_order, source: segment.four_track_timeline.performance, failure: ACTION_ORDER_FAILURE}
  - {id: identity_design, source: canon-lock, failure: IDENTITY_DRIFT}
  - {id: environment_state, source: canon-lock, failure: ENVIRONMENT_DRIFT}
  - {id: reflection_consistency, source: canon-lock, failure: REFLECTION_FAILURE}
  - {id: camera_setup_and_motion, source: shot.camera.setup_and_segment.camera_interval_map, failure: CAMERA_FAILURE}
  - {id: camera_position_path, source: shot.camera.setup_change_from_previous_and_segment.camera_interval_map, failure: CAMERA_SETUP_MISMATCH}
  - {id: editorial_boundary, source: editorial_boundaries, failure: EDITORIAL_BOUNDARY_FAILURE}
  - {id: dialogue_audio, source: sound-plan, failure: AUDIO_SYNC_FAILURE}
  - {id: entry_exit, source: segment.entry_state_and_exit_state, failure: HANDOFF_MISMATCH}
  - {id: split_interaction_state, source: generation_handoff.continuation_state_vector, failure: INTERACTION_CONTINUITY_FAILURE}
  - {id: media_integrity, source: render-report, failure: QC_MEDIA_SPEC_FAILURE}
handoff:
  policy_driven: true
  stable_tail_reject_if: [motion_blur, face_or_prop_occlusion, incomplete_expression_change, uncontrolled_water_or_smoke, unplanned_fast_pan, impossible_or_ambiguous_reflection]
  moving_endpoint_requires: [camera_path_evidence, continuity_state_match, entry_motion_compatibility]
  pass_with_editorial_fix_is_never_generation_handoff_eligible: true
  actual_final_frame_is_only_relay_candidate: true
  final_window_is_diagnostic_only: true
  successor_replay_of_completed_action: failure
